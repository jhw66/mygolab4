Name: user-api
Host: 0.0.0.0
Port: 8888
# 请求体上限（字节），默认 1MiB，视频上传需调大
MaxBytes: 524288000 
# 单次请求处理超时（毫秒），大文件上传需足够长
Timeout: 600000

Jwt:
  AccessTokenSecret: "accessToken-secret"
  AccessTokenExpire: 7200
  RefreshTokenSecret: "refreshToken-secret"
  RefreshTokenExpire: 604800
  ChallengeTokenSecret: "challengeToken-secret"
  ChallengeTokenExpire: 300

Totp:
  Issuer: "MyVideo"
  SecretCipherKey: "secret-cipher-key"
  QRCodeSize: 256
  QRCodeLevel: "M"

Mysql:
   Dsn: "wjhaccount:Wujiahui789@tcp(127.0.0.1:3306)/myvideo?parseTime=true&loc=UTC"
   MaxOpenConns: 20
   MaxIdleConns: 10
   ConnMaxLifetime: 3600

Redis:
   Addr: "127.0.0.1:6379"
   Password: ""
   DB: 7
   PoolSize: 20
   MinIdleConns: 5
